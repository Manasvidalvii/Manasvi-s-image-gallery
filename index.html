<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Search, Heart, and Nav Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="gallery-header">
        <h1>Manasvi'S Image Gallery</h1>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-input" placeholder="Search gallery...">
        </div>
        
        <!-- Category Filter Pills + Favorites -->
        <div class="filter-pills">
            <button class="pill active" data-filter="all">All</button>
            <button class="pill" data-filter="flower">Flower</button>
            <button class="pill" data-filter="animals">Animals</button>
            <button class="pill" data-filter="space">Space</button>
            <button class="pill" data-filter="sunset">Sunset</button>
            <button class="pill" data-filter="fort">Fort</button>
            <button class="pill fav-pill" data-filter="favorites">
                <i class="fa-solid fa-heart"></i> Favorites
            </button>
        </div>
    </header>

    <main class="gallery-container">
        <div class="gallery-grid" id="gallery-grid">
            
            <!-- FLOWER CATEGORY -->
            <div class="card" data-category="flower" data-id="1">
                <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=800&q=80" alt="Yellow Sunflower Blooming">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="flower" data-id="2">
                <img src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?auto=format&fit=crop&w=800&q=80" alt="Red Rose Petals">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="flower" data-id="3">
                <img src="https://images.unsplash.com/photo-1526047932273-341f2a7631f9?auto=format&fit=crop&w=800&q=80" alt="Pink Tulip Field">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <!-- ANIMALS CATEGORY -->
            <div class="card" data-category="animals" data-id="4">
                <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=800&q=80" alt="Pug in Blanket">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="animals" data-id="5">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=800&q=80" alt="Cozy Beagle Dog">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="animals" data-id="6">
                <img src="https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?auto=format&fit=crop&w=800&q=80" alt="Majestic Wild Lion">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <!-- SPACE CATEGORY -->
            <div class="card" data-category="space" data-id="7">
                <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=800&q=80" alt="Planet Earth from Space">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="space" data-id="8">
                <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=800&q=80" alt="Milky Way Galaxy Night Sky">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="space" data-id="9">
                <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=800&q=80" alt="Deep Cosmic Nebula">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <!-- SUNSET CATEGORY -->
            <div class="card" data-category="sunset" data-id="10">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Golden Beach Sunset">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="sunset" data-id="11">
                <img src="https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?auto=format&fit=crop&w=800&q=80" alt="Mountain Peak Sunset">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="sunset" data-id="12">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80" alt="Orange Sunset over Fields">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <!-- FORT CATEGORY -->
            <div class="card" data-category="fort" data-id="13">
                <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=800&q=80" alt="Historic Hill Fort Castle">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="fort" data-id="14">
                <img src="https://images.unsplash.com/photo-1599839575945-a9e5af0c3fa5?auto=format&fit=crop&w=800&q=80" alt="Ancient Stone Fortress Wall">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

            <div class="card" data-category="fort" data-id="15">
                <img src="https://images.unsplash.com/photo-1568849676085-51415703900f?auto=format&fit=crop&w=800&q=80" alt="Coastal Ancient Citadel">
                <button class="like-btn" title="Add to Favorites"><i class="fa-regular fa-heart"></i></button>
                <div class="card-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            </div>

        </div>
    </main>

    <!-- Lightbox Modal Container -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightbox-close">&times;</span>
        
        <button class="lightbox-btn prev-btn" id="prev-btn" aria-label="Previous Image">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="Full view">
            
            <div class="lightbox-footer">
                <span id="image-counter">1 / 15</span>
            </div>
        </div>

        <button class="lightbox-btn next-btn" id="next-btn" aria-label="Next Image">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
